name: Reusable — E2E Tests

on:
  workflow_call:

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # On cache miss: install browsers + system dependencies together
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox

      # On cache hit: browsers restored from cache, but system deps still needed
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox

      - name: Build for E2E
        # Uses npm run build (dist/client) rather than vercel build (.vercel/output)
        # because Playwright's web server requires a directly serveable directory.
        #
        # What this verifies: application behaviour, routing, accessibility,
        # and rendering correctness under a production-equivalent build.
        #
        # What this does not verify: the exact .vercel/output artifact that is
        # deployed. That artifact is guaranteed to be the one verified by CI
        # via the --prebuilt flag on the deploy step — this is a separate concern.
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 7

      # Traces and screenshots only on failure — too large to store always
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
