##############################################################################
# PR Pipeline
#
# Triggered by pull requests against master, including draft → ready conversion.
#
# Orchestration:
#
#   quality
#      ↓
#   test
#    ↙       ↘
# build-preview  test-e2e   ← parallel; both skipped for forks
#    ↘       ↙
#   deploy-preview           ← skipped for drafts and forks
#
# Draft PRs: quality and test run. build-preview, test-e2e, and deploy-preview
#   are skipped because there is no preview deployment for drafts.
#
# Fork PRs: quality and test run. build-preview, test-e2e, and deploy-preview
#   are skipped — repository secrets are unavailable to fork workflows,
#   and build/e2e are not useful without those secrets.
##############################################################################

name: PR Pipeline

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/reusable-quality.yml

  test:
    needs: [quality]
    uses: ./.github/workflows/reusable-test.yml

  build-preview:
    needs: [quality, test]
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/reusable-build.yml
    with:
      target: preview
    secrets: inherit

  test-e2e:
    needs: [quality, test]
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/reusable-e2e.yml

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build-preview, test-e2e]
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    environment: preview
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vercel-output-preview
          path: .vercel/output

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          RAW=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --json)
          URL=$(echo "$RAW" | jq -r '.url')
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const body = [
              '## 🔍 Preview Deployment',
              '',
              `**URL:** ${process.env.PREVIEW_URL}`,
              '',
              `*Built from commit \`${context.sha}\`*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes('🔍 Preview Deployment'),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
