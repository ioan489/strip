##############################################################################
# Production Pipeline
#
# Triggered by pushes to master (i.e. when a PR is merged).
#
# Orchestration:
#
#   quality
#      ↓
#   test
#    ↙          ↘
# build-production  test-e2e   ← parallel
#    ↘          ↙
#   deploy-production
#
# cancel-in-progress: false — never cancel a production deploy mid-flight.
# A second push to master queues behind the first.
##############################################################################

name: Production Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  # Never cancel a production deploy mid-flight.
  # A second push to master queues behind the first.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/reusable-quality.yml

  test:
    needs: [quality]
    uses: ./.github/workflows/reusable-test.yml

  build-production:
    needs: [quality, test]
    uses: ./.github/workflows/reusable-build.yml
    with:
      target: production
      prod_flag: '--prod'
    secrets: inherit

  test-e2e:
    needs: [quality, test]
    uses: ./.github/workflows/reusable-e2e.yml

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build-production, test-e2e]
    environment: production
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vercel-output-production
          path: .vercel/output

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
