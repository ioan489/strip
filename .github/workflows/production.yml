##############################################################################
# Production Pipeline
#
# Triggered by pushes to master (i.e., when a PR is merged) or manual dispatch.
#
# Orchestration:
#
#   quality
#      ↓
#   test
#    ↙          ↘
#  build       test-e2e   ← parallel
#    ↘          ↙
#  deploy-production
#      ↓
#    CI (gate)            ← single required check for branch protection
#
# cancel-in-progress: false — never cancel a production deploy mid-flight.
# A second push to master queues behind the first.
##############################################################################

name: Production Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  # Never cancel a production deploy mid-flight.
  # A second push to master queues behind the first.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/reusable-quality.yml

  test:
    needs: [quality]
    uses: ./.github/workflows/reusable-test.yml

  build:
    name: Build
    needs: [quality, test]
    uses: ./.github/workflows/reusable-build.yml
    with:
      target: production
      prod_flag: '--prod'
    secrets: inherit

  test-e2e:
    needs: [quality, test]
    uses: ./.github/workflows/reusable-e2e.yml

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build, test-e2e]
    environment: production
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vercel-output-production
          path: .vercel/output

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  ci-gate:
    name: CI
    runs-on: ubuntu-latest
    needs: [quality, test, build, test-e2e, deploy-production]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Evaluate production pipeline
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.test-e2e.result }}
          DEPLOY: ${{ needs.deploy-production.result }}
        run: |
          echo "quality=$QUALITY test=$TEST build=$BUILD e2e=$E2E deploy=$DEPLOY"

          for r in "$QUALITY" "$TEST" "$BUILD" "$E2E" "$DEPLOY"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ Production pipeline failed or was cancelled"
              exit 1
            fi
          done

          echo "✅ Production pipeline completed successfully"
