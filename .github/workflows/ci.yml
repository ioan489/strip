##############################################################################
# .github/workflows/ci.yml
#
# CI/CD pipeline — runs on every push and pull request.
#
# Job graph:
#
#   quality ──► test ──► build ──► test-e2e ──► deploy-preview   (PRs)
#                          └──────────────► deploy-production  (main)
#
# ── Why three separate jobs? ──────────────────────────────────────────────────
# 1. quality   — lint runs in ~15s. If it fails, build is skipped entirely.
#                Developers get fast feedback without waiting for a 3-min build.
# 2. build     — runs npm run build, uploads dist/client as a GitHub artifact.
#                The deploy jobs download this artifact instead of rebuilding,
#                so the exact same bytes that were verified in CI are deployed.
# 3. deploy-*  — two separate jobs with separate GitHub Environments allow
#                different protection rules (e.g., require a reviewer for prod).
#
# ── Two deployment strategies ─────────────────────────────────────────────────
# This file shows GITHUB ACTIONS deployment (Strategy A).
#
# Strategy B (simpler for solo projects):
#   Connect your repo to Vercel at vercel.com → "New Project".
#   Vercel's bot creates preview URLs for every PR and deploys main automatically.
#   Keep only the `quality` and `build` jobs below (delete the deploy-* jobs).
#   Vercel reads vercel.json for build config; no secrets or extra setup needed.
#
# ── One-time setup for Strategy A (GitHub Actions deploy) ─────────────────────
# 1. Install Vercel CLI locally: npm i -g vercel
# 2. Run: vercel link   (creates .vercel/project.json — optionally commit this)
# 3. Add three secrets to your GitHub repo:
#    Settings → Secrets and variables → Actions → New repository secret
#      VERCEL_TOKEN      — from vercel.com/account/tokens
#      VERCEL_ORG_ID     — from .vercel/project.json or Vercel dashboard
#      VERCEL_PROJECT_ID — from .vercel/project.json or Vercel dashboard
# 4. Create two Environments in GitHub:
#    Settings → Environments → New environment
#      preview    — no protection rules
#      production — add "Required reviewers" rule (optional but recommended)
##############################################################################

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel any in-progress run on the same branch when a newer commit arrives.
# This prevents stale builds from deploying over a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions — jobs that need more declare it explicitly.
permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Quality
# Runs lint checks first. If this fails, build is skipped — saving CI minutes.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # reads the value from .nvmrc
          cache: npm # caches node_modules based on package-lock.json hash

      - name: Install dependencies
        run:
          npm ci # npm ci is faster than npm install in CI;
          # it installs exactly what's in package-lock.json

      - name: Lint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Unit + Integration tests
  # Fast feedback — runs in parallel with nothing; no browser required.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [quality]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run unit and integration tests
        run: npm run test:coverage
        env:
          NODE_ENV: test
          LOG_MIN_LEVEL: error # suppress all but errors in CI test output

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build
  # Runs the full SSG pipeline. Uploads the output as a versioned artifact
  # so deploy jobs use the same files that were built and verified here.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test] # waits for quality, test to pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Vite stores its transform cache in node_modules/.vite.
      # node_modules is already cached by setup-node, so Vite's cache
      # comes along for free. No separate cache step needed.
      - name: Build via Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NODE_ENV: production
          LOG_MIN_LEVEL: warn
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Upload dist/client as a named artifact. The name includes the git SHA
      # so you can download the exact artifact from any past workflow run.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output-${{ github.sha }}
          path: .vercel/output
          # Keep artifacts for 7 days — useful for debugging a failed deploy
          # or rolling back by re-deploying an old artifact via the Actions UI.
          retention-days: 7
          compression-level: 6 # balanced speed/size (0–9, default 6)

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: E2E tests (runs against the built artifact)
  # ─────────────────────────────────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build for E2E
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4a: Deploy Preview (pull requests only)
  # Creates a unique preview URL for every PR so you can review the exact output
  # before merging. Deploys to Vercel without the --prod flag.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    environment: preview # maps to the "preview" GitHub Environment

    # Allow this job to post the preview URL back to the PR as a comment
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # needed for vercel.json

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-output-${{ github.sha }}
          path: .vercel/output

      - name: Install Vercel CLI
        # Pin to a specific major version to avoid surprise breaking changes.
        run: npm install --global vercel@latest

      # Deploy the pre-built dist/client directory.
      # --prebuilt tells Vercel "the build is done, just upload these files".
      # Without --prebuilt, Vercel would run npm run build again on their servers
      # (wasteful and would produce a different build from the one we verified).
      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --json | jq -r '.url')
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Post the preview URL as a PR comment so reviewers can click straight to it.
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 Preview Deployment\n\n**URL:** ${process.env.PREVIEW_URL}\n\n*Built from commit \`${context.sha}\`*`,
            });

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4b: Deploy Production (master branch only)
  # Deploys to production with --prod. Only runs when a commit lands on master
  # (i.e., a PR is merged), never on PR branches.
  # The "production" GitHub Environment can require manual approval before
  # this job runs — go to Settings → Environments → production → add reviewer.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production # maps to the "production" GitHub Environment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-output-${{ github.sha }}
          path: .vercel/output

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # --prod promotes this deployment to the production alias (your main domain).
      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
