##############################################################################
# SECURITY:
# This workflow uses pull_request_target, which runs in the base repository
# context with write-capable permissions.
#
# It must NEVER checkout or execute code from the PR branch.
# This workflow is API-only: it reads Dependabot metadata and enables
# GitHub auto-merge.
##############################################################################

name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Show Dependabot metadata
        run: |
          echo "update-type=${{ steps.metadata.outputs.update-type }}"
          echo "dependency-group=${{ steps.metadata.outputs.dependency-group }}"

      - name: Enable auto-merge for minor and patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash
