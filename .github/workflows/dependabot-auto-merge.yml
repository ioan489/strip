# SECURITY: This workflow uses pull_request_target, which runs with elevated
# privileges in the base repository context. It must NEVER checkout or execute
# code from the PR branch. This workflow is API-only: it reads PR metadata
# and enables GitHub auto-merge. No code execution.
name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: dependabot-automerge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for minor and patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash
