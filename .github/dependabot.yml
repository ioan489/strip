version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5

    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

    commit-message:
      prefix: 'chore(deps)'

    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5

    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

    commit-message:
      prefix: 'chore(ci)'

    labels:
      - dependencies
      - ci
